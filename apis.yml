aid: merlin-labs
name: Merlin Labs
description: >-
  Merlin (Merlin Labs, Inc., NASDAQ: MRLN) is a Boston-headquartered aerospace and defense
  company founded in 2018 that builds takeoff-to-touchdown flight autonomy for legacy and
  next-generation aircraft. Its product is the Merlin Pilot, an aircraft-agnostic, AI-powered
  autonomy stack that pairs machine-learning mission planning with deterministic, hardcoded
  fallback flight systems, and that has flown hundreds of autonomous flights from test
  facilities in Kerikeri (New Zealand), Quonset Point (Rhode Island) and Bedford/Hanscom
  (Massachusetts). Merlin is a prime contractor to USSOCOM for C-130J autonomy, works with
  the U.S. Air Force on KC-135 tanker autonomy, and collaborates with Northrop Grumman,
  Honeywell, GE Aerospace and Israel Aerospace Industries. The company holds a New Zealand
  Part 146 aircraft design organization designation and reached Stage of Involvement 3
  (SOI 3) with the Civil Aviation Authority of New Zealand in August 2026. Merlin became
  publicly traded in March 2026 through a business combination with Inflection Point
  Acquisition Corp IV. Merlin sells embedded flight-autonomy software to aircraft OEMs,
  primes and government programs; it publishes no public developer program, API, SDK or
  machine-readable contract.
